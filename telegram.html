<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>ورود تلگرام | UNIBAR</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="icon.svg">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Hide the page until Telegram identity lookup finishes to prevent a flash. */
    .app-shell { visibility: hidden; }
    body.show-page .app-shell { visibility: visible; }
    .telegram-card {
      width: min(560px, calc(100% - 32px));
      box-sizing: border-box;
      margin: 6vh auto 0;
      text-align: center;
    }
    .telegram-card h2, .telegram-card > .telegram-note { text-align: center; }
    .telegram-note { line-height: 1.9; opacity: .9; }
    .telegram-actions { display: flex; justify-content: center; margin-top: 20px; }
    .telegram-actions[hidden], .telegram-form[hidden], [hidden] { display: none !important; }
    #showManualButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      box-sizing: border-box;
      padding: 12px 18px;
      border: 1px solid #2563eb;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    #showManualButton:focus-visible, .telegram-form button:focus-visible,
    .telegram-form input:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .telegram-form { margin-top: 18px; display: grid; gap: 10px; text-align: right; }
    .telegram-form label { font-weight: 600; }
    .telegram-form input {
      width: 100%; min-height: 46px; box-sizing: border-box; padding: 12px 14px;
      border-radius: 10px; border: 1px solid var(--border, #777); font: inherit;
      direction: ltr; text-align: left;
    }
    .telegram-form button {
      min-height: 46px; padding: 10px 16px; border-radius: 10px;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .telegram-form button[type="submit"] { background: #2563eb; border: 1px solid #2563eb; color: #fff; }
    .telegram-status { margin-top: 10px; min-height: 1.5em; line-height: 1.8; text-align: center; }
    @media (max-width: 360px) {
      .telegram-card { width: calc(100% - 24px); margin-top: 4vh; }
      #showManualButton { padding-inline: 10px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">برنامه دانشگاه</div>
        <h1>ورود به UNIBAR</h1>
      </div>
      <div class="top-actions">
        <a class="text-link" href="./index.html">صفحه اصلی سایت</a>
      </div>
    </header>

    <main class="main">
      <section class="login-card telegram-card" aria-live="polite">
        <h2 id="statusTitle">در حال بررسی حساب…</h2>
        <p id="statusText" class="telegram-note">چند لحظه صبر کنید.</p>

        <div id="missingUserActions" class="telegram-actions" hidden>
          <button id="showManualButton" type="button">ورود با شناسه کاربر</button>
        </div>

        <form id="manualForm" class="telegram-form" hidden>
          <label for="studentUsername">شناسه کاربر در UNIBAR</label>
          <input id="studentUsername" name="user" type="text" placeholder="شناسه کاربر را وارد کنید" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="80">
          <button type="submit">ورود</button>
        </form>

        <p id="formStatus" class="telegram-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script>
    // نگاشت شناسه عددی تلگرام به شناسه کاربر در UNIBAR.
    // این نگاشت داخل فایل عمومی است و به‌تنهایی احراز هویت امن محسوب نمی‌شود.
    const TELEGRAM_TO_UNIBAR_USER = {
      "595496154": "a",
      "920865997": "p"
    };

    const BASE = new URL("./", window.location.href);
    const titleEl = document.getElementById("statusTitle");
    const textEl = document.getElementById("statusText");
    const missingActions = document.getElementById("missingUserActions");
    const showManualButton = document.getElementById("showManualButton");
    const manualForm = document.getElementById("manualForm");
    const usernameInput = document.getElementById("studentUsername");
    const formStatus = document.getElementById("formStatus");

    function goToSchedule(username) {
      const cleanUsername = String(username || "").trim();
      if (!cleanUsername || cleanUsername.length > 80) return;
      const url = new URL("schedule.html", BASE);
      url.searchParams.set("user", cleanUsername);
      window.location.assign(url.href);
    }

    function showNotFound() {
      titleEl.textContent = "کاربر پیدا نشد";
      textEl.textContent = "برای ورود، شناسه کاربر خود را وارد کنید.";
      missingActions.hidden = false;
      document.body.classList.add("show-page");
    }

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) tg.ready();

    const telegramId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user
      ? String(tg.initDataUnsafe.user.id)
      : "";
    const ownUsername = TELEGRAM_TO_UNIBAR_USER[telegramId] || "";

    if (ownUsername) {
      // کاربر شناخته‌شده مستقیماً به برنامه منتقل می‌شود.
      goToSchedule(ownUsername);
    } else {
      showNotFound();
    }

    showManualButton.addEventListener("click", () => {
      missingActions.hidden = true;
      manualForm.hidden = false;
      formStatus.textContent = "";
      usernameInput.focus();
    });

    manualForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const username = usernameInput.value.trim();
      if (!username || username.length > 80) {
        formStatus.textContent = "لطفاً یک شناسه کاربر معتبر وارد کنید.";
        return;
      }
      formStatus.textContent = "در حال باز کردن برنامه…";
      goToSchedule(username);
    });
  </script>
</body>
</html>
