<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318"><link rel="stylesheet" href="styles.css"><link rel="icon" href="icon.svg">
<title>برنامه دانشگاه</title>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div><div class="eyebrow">برنامه دانشگاه</div><h1>انتخاب کاربر</h1></div>
  <a class="text-link" href="editor.html">ویرایشگر</a>
</header>
<main class="main">
  <div id="users" class="user-list"><div class="empty">در حال خواندن کاربران…</div></div>
</main>
</div>
<script>
async function loadUsers(){
  const box=document.getElementById("users");
  try{
    const r=await fetch("users/index.json?"+Date.now());
    if(!r.ok) throw new Error();
    const data=await r.json();
    if(!data.users?.length){box.innerHTML='<div class="empty"><strong>کاربری وجود ندارد</strong></div>';return;}
    box.innerHTML=data.users.map(u=>`
      <a class="user-card" href="schedule.html?user=${encodeURIComponent(u.username)}">
        <div class="avatar">${(u.displayName||u.username).slice(0,1)}</div>
        <div><strong>${escapeHtml(u.displayName||u.username)}</strong><span>@${escapeHtml(u.username)}</span></div>
        <b>←</b>
      </a>`).join("");
  }catch(e){box.innerHTML='<div class="empty"><strong>فایل کاربران پیدا نشد</strong><span>مطمئن شو users/index.json در مخزن وجود دارد.</span></div>';}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
loadUsers();
</script>
</body></html>
