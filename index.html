<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318"><link rel="stylesheet" href="styles.css"><link rel="icon" href="icon.svg"><script src="fonts.js"></script>
<title>برنامه دانشگاه</title>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div><div class="eyebrow">برنامه دانشگاه</div><h1>ورود</h1></div>
  <div class="top-actions"><div data-font-picker></div><a class="text-link" href="editor.html">ویرایشگر</a></div>
</header>
<main class="main">
  <form id="loginForm" class="login-card" autocomplete="off">
    <label for="uid">شناسه (id) خودت را وارد کن</label>
    <input id="uid" class="input" dir="ltr" placeholder="ABOL" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <button class="primary" type="submit">ورود به برنامه</button>
    <div id="msg" class="login-msg" role="alert"></div>
    <button type="button" id="forgotBtn" class="linklike" aria-expanded="false" aria-controls="forgot">شناسه‌ام را فراموش کرده‌ام</button>
  </form>

  <section id="forgot" class="login-card" hidden>
    <label for="part">هر بخشی از شناسه‌ات را که یادت هست بنویس</label>
    <input id="part" class="input" dir="ltr" placeholder="12345" autocapitalize="none" autocorrect="off" spellcheck="false">
    <div class="hint-line">حداقل ۳ حرف یا رقمِ پشت‌سرهم بنویس. شناسه‌هایی که این بخش را دارند (یا شبیه آن‌اند) نمایش داده می‌شوند.</div>
    <div id="matches" class="matches" aria-live="polite"></div>
  </section>

  <section id="all" class="login-card" hidden>
    <div id="allTitle" class="match-title"></div>
    <div id="allList" class="matches"></div>
  </section>

  <div id="count" class="user-count" hidden></div>
</main>
</div>
<script>
const form=document.getElementById("loginForm"),uid=document.getElementById("uid"),msg=document.getElementById("msg");
const forgotBtn=document.getElementById("forgotBtn"),forgot=document.getElementById("forgot"),part=document.getElementById("part"),matches=document.getElementById("matches");
const allBox=document.getElementById("all"),allTitle=document.getElementById("allTitle"),allList=document.getElementById("allList");
const ADMIN_ALL="@sign_all",MIN_PART=3,MAX_SHOW=10;
const say=t=>{msg.textContent=t};
const note=(box,t)=>{box.replaceChildren();const d=document.createElement("div");d.className="match-empty";d.textContent=t;box.appendChild(d)};
let usersPromise=null; /* فهرست کاربران یک بار خوانده می‌شود و برای شمارنده، ورود، فراموشی و فهرست مدیر استفاده می‌شود */
const loadUsers=()=>usersPromise||(usersPromise=fetch("users/index.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error();return r.json()}).catch(e=>{usersPromise=null;throw e}));
const getUsers=async()=>{
  if(location.protocol==="file:")throw new Error("file");
  return ((await loadUsers()).users||[]).filter(u=>u&&u.username);
};
const failText=e=>e&&e.message==="file"?"سایت باید از طریق سرور باز شود (GitHub Pages یا python -m http.server).":"خواندن فهرست کاربران ناموفق بود.";

/* طولانی‌ترین بخشِ پشت‌سرهمِ مشترک بین دو متن */
function lcs(a,b){
  let best=0,prev=new Array(b.length+1).fill(0);
  for(let i=1;i<=a.length;i++){
    const cur=new Array(b.length+1).fill(0);
    for(let j=1;j<=b.length;j++)if(a[i-1]===b[j-1]){cur[j]=prev[j-1]+1;if(cur[j]>best)best=cur[j];}
    prev=cur;
  }
  return best;
}
function matchLink(u,showName){
  const a=document.createElement("a");
  a.className="match";a.href="schedule.html?user="+encodeURIComponent(u.username);
  const id=document.createElement("b");id.dir="ltr";id.textContent=u.username;a.appendChild(id);
  if(showName&&u.displayName&&u.displayName!==u.username){const n=document.createElement("span");n.textContent=u.displayName;a.appendChild(n);}
  return a;
}
function group(box,title,list,showName){
  if(!list.length)return;
  const t=document.createElement("div");t.className="match-group";t.textContent=title;box.appendChild(t);
  list.forEach(u=>box.appendChild(matchLink(u,showName)));
}

/* ---- ورود ---- */
async function showAll(){
  allBox.hidden=false;note(allList,"در حال خواندن…");allTitle.textContent="همه‌ی کاربران";
  try{
    const users=await getUsers();
    allTitle.textContent=`همه‌ی کاربران (${users.length.toLocaleString("fa-IR")})`;
    allList.replaceChildren();
    if(!users.length)note(allList,"کاربری ثبت نشده است.");
    users.forEach(u=>allList.appendChild(matchLink(u,true)));
  }catch(e){note(allList,failText(e));}
}
const isAdminAll=()=>uid.value.trim().toLowerCase()===ADMIN_ALL;
uid.addEventListener("input",()=>{if(isAdminAll())showAll();else allBox.hidden=true;});
form.addEventListener("submit",async e=>{
  e.preventDefault();
  const id=uid.value.trim().toLowerCase();
  if(!id)return;
  if(id===ADMIN_ALL){say("");showAll();return;}
  say("در حال بررسی…");
  try{
    const users=await getUsers();
    const u=users.find(x=>String(x.username).toLowerCase()===id);
    if(!u){say("کاربری با این شناسه پیدا نشد. اگر یادت رفته «شناسه‌ام را فراموش کرده‌ام» را بزن.");return;}
    location.href="schedule.html?user="+encodeURIComponent(u.username);
  }catch(e){say(failText(e));}
});

/* ---- فراموشی شناسه ---- */
forgotBtn.addEventListener("click",()=>{
  forgot.hidden=!forgot.hidden;
  forgotBtn.setAttribute("aria-expanded",String(!forgot.hidden));
  if(!forgot.hidden){part.focus();search();}
});
async function search(){
  const q=part.value.trim().toLowerCase();
  if(q.length<MIN_PART){note(matches,`حداقل ${MIN_PART.toLocaleString("fa-IR")} حرف یا رقم بنویس.`);return;}
  if(q===ADMIN_ALL){note(matches,"چیزی پیدا نشد.");return;}
  let users;
  try{users=await getUsers();}catch(e){note(matches,failText(e));return;}
  if(part.value.trim().toLowerCase()!==q)return; /* ورودی در این فاصله عوض شده */
  const exact=[],similar=[],need=Math.max(MIN_PART,Math.ceil(q.length*0.6));
  users.forEach(u=>{
    const n=String(u.username).toLowerCase();
    if(n.includes(q))exact.push(u);
    else{const s=lcs(q,n);if(s>=need)similar.push({u,s});}
  });
  similar.sort((a,b)=>b.s-a.s||String(a.u.username).localeCompare(String(b.u.username)));
  const ex=exact.slice(0,MAX_SHOW),sim=similar.slice(0,Math.max(0,MAX_SHOW-ex.length)).map(x=>x.u);
  matches.replaceChildren();
  if(!ex.length&&!sim.length){note(matches,"شناسه‌ای شبیه این پیدا نشد. بخش دیگری از شناسه را امتحان کن یا از مدیر بپرس.");return;}
  group(matches,"شامل این بخش",ex,false);
  group(matches,"شبیه",sim,false);
}
part.addEventListener("input",search);

async function showCount(){
  try{
    const n=(await getUsers()).length,box=document.getElementById("count");
    box.textContent=`تعداد کاربران: ${n.toLocaleString("fa-IR")}`;
    box.hidden=false;
  }catch{}
}
showCount();
uid.focus();
</script>
</body></html>
