<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318"><link rel="stylesheet" href="styles.css"><link rel="icon" href="icon.svg">
<title>برنامه</title>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div><div class="eyebrow" id="userLabel">برنامه دانشگاه</div><h1 id="pageTitle">امروز</h1></div>
  <a class="text-link" href="index.html">کاربران</a>
</header>
<main id="app" class="main"></main>
<nav class="bottom-nav">
<button class="nav-item active" data-view="today"><span class="nav-icon">⌂</span><span>امروز</span></button>
<button class="nav-item" data-view="week"><span class="nav-icon">▦</span><span>هفته</span></button>
<button class="nav-item" data-view="terms"><span class="nav-icon">▤</span><span>ترم‌ها</span></button>
</nav>
</div>
<script>
const DAYS=[{id:"sat",name:"شنبه"},{id:"sun",name:"یکشنبه"},{id:"mon",name:"دوشنبه"},{id:"tue",name:"سه‌شنبه"},{id:"wed",name:"چهارشنبه"},{id:"thu",name:"پنجشنبه"},{id:"fri",name:"جمعه"}];
const HOUR_PX=72;
let state=null,currentView="today",clash=new Set();
const username=new URLSearchParams(location.search).get("user");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const safeColor=c=>/^#[0-9a-f]{3,8}$/i.test(c||"")?c:"#111318";
const norm=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||"");return m?m[1].padStart(2,"0")+":"+m[2]:"00:00"};
const mins=t=>{const [h,m]=norm(t).split(":").map(Number);return h*60+m};
const dayIdx=()=>((new Date().getDay()+1)%7);
const todayId=()=>DAYS[dayIdx()].id;
const active=()=>(state.terms||[]).find(t=>t.id===state.activeTermId)||(state.terms||[])[0];
const classesDay=d=>[...(active()?.classes||[])].filter(c=>c.day===d).sort((a,b)=>mins(a.start)-mins(b.start));
const dateFa=()=>new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
const place=c=>[c.faculty,c.room].filter(Boolean).join(" · ");
const placeLong=c=>[c.faculty,c.room?"کلاس "+c.room:""].filter(Boolean).join(" · ");
function findClash(){
  const cs=active()?.classes||[],s=new Set();
  cs.forEach((a,i)=>cs.slice(i+1).forEach(b=>{
    if(a.day===b.day&&mins(a.start)<mins(b.end)&&mins(b.start)<mins(a.end)){s.add(a.id);s.add(b.id);}
  }));
  return s;
}
const card=c=>`<article class="class-card" style="--card-color:${safeColor(c.color)}"><div class="class-top"><div class="class-name">${esc(c.name)}</div><div class="class-time">${norm(c.start)} — ${norm(c.end)}</div></div><div class="class-meta">${place(c)?`<span class="pill location">📍 ${esc(place(c))}</span>`:""}${c.teacher?`<span class="pill">استاد: ${esc(c.teacher)}</span>`:""}${c.units?`<span class="pill">${esc(c.units)} واحد</span>`:""}${clash.has(c.id)?`<span class="pill warn">⚠ تداخل زمانی</span>`:""}</div></article>`;
function nextClass(){
  const cs=classesDay(todayId()), now=new Date().getHours()*60+new Date().getMinutes(), c=cs.find(x=>mins(x.end)>now);
  if(c)return {c,today:true};
  for(let i=1;i<=7;i++){const d=DAYS[(dayIdx()+i)%7],c2=classesDay(d.id)[0];if(c2)return {c:c2,today:false,day:d}}
}
function renderToday(){
  const n=nextClass(); let html="";
  html+=`<section class="hero">${n?`<div class="label">${n.today?"کلاس بعدی امروز":"کلاس بعدی این هفته"}</div><h2>${esc(n.c.name)}</h2><div class="meta">${n.today?dateFa():n.day.name}${n.c.teacher?" · "+esc(n.c.teacher):""}</div><div class="hero-time">${norm(n.c.start)} — ${norm(n.c.end)}</div>${placeLong(n.c)?`<div class="hero-location">📍 ${esc(placeLong(n.c))}</div>`:""}`:`<div class="label">این هفته</div><h2>کلاسی ثبت نشده</h2>`}</section>`;
  const cs=classesDay(todayId()); html+=`<div class="section-head"><h2>${DAYS[dayIdx()].name}</h2><span>${cs.length} کلاس</span></div>`;
  html+=cs.length?cs.map(card).join(""):`<div class="empty"><strong>امروز کلاس نداری 🎉</strong></div>`;
  return html;
}
/* چیدمان کلاس‌های هم‌پوشان کنار هم در جدول هفتگی */
function layout(cs){
  const out=[];let cluster=[],end=0;
  const flush=()=>{
    const lanes=[],start=out.length;
    cluster.forEach(c=>{
      let l=lanes.findIndex(e=>e<=mins(c.start));
      if(l<0){l=lanes.length;lanes.push(0);}
      lanes[l]=mins(c.end);
      out.push({c,lane:l});
    });
    for(let i=start;i<out.length;i++)out[i].n=lanes.length;
    cluster=[];
  };
  cs.forEach(c=>{
    if(cluster.length&&mins(c.start)>=end)flush();
    end=cluster.length?Math.max(end,mins(c.end)):mins(c.end);
    cluster.push(c);
  });
  if(cluster.length)flush();
  return out;
}
function renderWeekDesktop(){
  const all=active()?.classes||[];
  let h0=8,h1=18;
  all.forEach(c=>{h0=Math.min(h0,Math.floor(mins(c.start)/60));h1=Math.max(h1,Math.ceil(mins(c.end)/60));});
  h1=Math.min(Math.max(h1,h0+1),24);
  const hours=h1-h0,height=hours*HOUR_PX,tid=todayId();
  const heads=`<div class="week-head"></div>`+DAYS.map(d=>`<div class="week-head ${d.id===tid?"today":""}">${d.name}</div>`).join("");
  const timeCol=`<div class="time-col">${Array.from({length:hours},(_,i)=>`<div class="time-cell">${String(h0+i).padStart(2,"0")}:00</div>`).join("")}</div>`;
  const cols=DAYS.map(d=>{
    const ev=layout(classesDay(d.id)).map(({c,lane,n})=>{
      const top=(mins(c.start)-h0*60)*HOUR_PX/60;
      const h=Math.max(mins(c.end)-mins(c.start),30)*HOUR_PX/60-2;
      return `<div class="week-event" style="top:${top}px;height:${h}px;right:calc(${lane*100/n}% + 3px);left:auto;width:calc(${100/n}% - 6px);background:${safeColor(c.color)}" title="${esc(c.name)}"><strong>${clash.has(c.id)?"⚠ ":""}${esc(c.name)}</strong><span class="ev-time">${norm(c.start)}–${norm(c.end)}</span>${c.room?`<span>${esc(c.room)}</span>`:""}</div>`;
    }).join("");
    return `<div class="day-col" style="height:${height}px;min-height:${height}px">${ev}</div>`;
  }).join("");
  return `<div class="week-desktop week-wrap"><div class="week-grid">${heads}${timeCol}${cols}</div></div>`;
}
function renderWeekMobile(){
  return `<div class="week-mobile">${DAYS.map(d=>{const cs=classesDay(d.id);return `<section class="week-mobile-day"><div class="day-title"><strong>${d.name}</strong>${d.id===todayId()?`<span>امروز</span>`:""}</div>${cs.length?cs.map(card).join(""):`<div class="empty"><span>کلاسی نیست</span></div>`}</section>`}).join("")}</div>`;
}
const renderWeek=()=>renderWeekDesktop()+renderWeekMobile();
function renderTerms(){
  const ts=state.terms||[];
  if(!ts.length)return `<div class="empty">ترمی ثبت نشده.</div>`;
  const a=active();
  return ts.map(t=>`<div class="term-card ${t===a?"active":""}"><div class="term-head"><div class="term-title">${esc(t.name)}</div><span class="badge">${(t.classes||[]).length} جلسه</span></div></div>`).join("");
}
function render(){
  if(!state)return;
  clash=findClash();
  document.querySelectorAll(".nav-item").forEach(x=>x.classList.toggle("active",x.dataset.view===currentView));
  document.getElementById("pageTitle").textContent={today:"امروز",week:"هفته",terms:"ترم‌ها"}[currentView];
  document.getElementById("app").innerHTML=currentView==="today"?renderToday():currentView==="week"?renderWeek():renderTerms();
}
const fetchJson=url=>fetch(url+"?"+Date.now()).then(r=>{if(!r.ok)throw new Error("http");return r.json()});
const showError=(t,s)=>{document.getElementById("app").innerHTML=`<div class="empty"><strong>${t}</strong><span>${s}</span></div>`};
async function init(){
  if(location.protocol==="file:"){showError("سایت باید از طریق سرور باز شود","با دابل‌کلیک روی فایل کار نمی‌کند. از GitHub Pages یا یک سرور محلی (python -m http.server) استفاده کن.");return;}
  try{
    const idx=await fetchJson("users/index.json");
    const u=(idx.users||[]).find(x=>x.username===username);
    if(!u){showError("کاربر پیدا نشد","نام کاربری را بررسی کن.");return;}
    state=await fetchJson(u.file);
    if(!Array.isArray(state.terms))state.terms=[];
    document.getElementById("userLabel").textContent=state.displayName?`${state.displayName} · @${state.username}`:`@${state.username}`;
    document.title=state.displayName||state.username||"برنامه";
    render();
  }catch(e){showError("خواندن فایل برنامه ناموفق بود","مطمئن شو فایل کاربر داخل پوشه users وجود دارد و JSON معتبر است.");}
}
document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>{currentView=b.dataset.view;render()});
init();
</script>
</body></html>
