<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318"><link rel="stylesheet" href="styles.css"><link rel="icon" href="icon.svg">
<title>ساخت فایل برنامه</title>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div><div class="eyebrow">ابزار مدیر</div><h1>ساخت فایل کاربر</h1></div>
  <a class="text-link" href="index.html">نمایش سایت</a>
</header>
<main class="main">
<section class="setting-card">
  <div class="section-head" style="margin-top:0"><h2>۱. اطلاعات کاربر</h2></div>
  <div class="form-grid">
    <div class="field"><label>نام کاربری انگلیسی</label><input id="username" class="input" value="a" placeholder="مثلاً ali" pattern="[A-Za-z0-9_-]+" required oninput="data.username=this.value"></div>
    <div class="field"><label>نام نمایشی</label><input id="displayName" class="input" value="Abolfazl" placeholder="مثلاً علی رضایی" oninput="data.displayName=this.value"></div>
  </div>
</section>
<section class="setting-card">
  <div class="section-head" style="margin-top:0"><h2>۲. ترم و کلاس‌ها</h2><button class="primary" onclick="addTerm()">+ ترم</button></div>
  <div id="terms"></div>
</section>
<section class="setting-card">
  <div class="section-head" style="margin-top:0"><h2>۳. خروجی</h2></div>
  <p style="font-size:12px;color:var(--muted);line-height:1.9">با ذخیره، یک فایل JSON ساخته می‌شود. اسم فایل باید دقیقاً <b>username.json</b> باشد؛ سپس آن را داخل پوشه <b>users</b> مخزن GitHub بگذار.</p>
  <button class="primary" onclick="downloadUser()">ذخیره و دریافت فایل</button>
  <label class="file-label" style="margin-right:7px">ویرایش فایل موجود<input type="file" accept=".json,application/json" onchange="loadFile(event)"></label>
</section>
</main>
</div>
<script>
const DAYS=[["sat","شنبه"],["sun","یکشنبه"],["mon","دوشنبه"],["tue","سه‌شنبه"],["wed","چهارشنبه"],["thu","پنجشنبه"],["fri","جمعه"]];
const COLORS=["#111318","#315cdb","#a04cbe","#0b8b68","#c56b19","#a73d4b","#4b6478","#6b5aa6"];
let data={version:1,username:"a",displayName:"Abolfazl",activeTermId:"t1",terms:[{id:"t1",name:"نیمسال اول ۱۴۰۴–۱۴۰۵",classes:[]}]};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const safeColor=c=>/^#[0-9a-f]{3,8}$/i.test(c||"")?c:"#111318";
const norm=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||"");return m?m[1].padStart(2,"0")+":"+m[2]:""};
const mins=t=>{const n=norm(t);if(!n)return 0;const [h,m]=n.split(":").map(Number);return h*60+m};
const dayName=id=>(DAYS.find(d=>d[0]===id)||[,id])[1];
const newClass=(color)=>({id:"c_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),name:"",day:"sat",start:"08:00",end:"09:30",faculty:"",room:"",teacher:"",units:0,color:color||COLORS[0]});

function syncUserFields(){
 document.getElementById("username").value=data.username||"";
 document.getElementById("displayName").value=data.displayName||"";
}
function addTerm(){
 data.terms.push({id:"t_"+Date.now(),name:"ترم جدید",classes:[]});
 data.activeTermId=data.terms.at(-1).id;
 render();
}
function setActive(ti){data.activeTermId=data.terms[ti].id;render();}
function addClass(ti){
 const t=data.terms[ti];
 t.classes.push(newClass(COLORS[t.classes.length%COLORS.length]));
 render();
}
function removeClass(ti,ci){data.terms[ti].classes.splice(ci,1);render();}
function clashes(cs){
 const pairs=[];
 cs.forEach((a,i)=>cs.slice(i+1).forEach(b=>{
  if(a.day===b.day&&mins(a.start)<mins(b.end)&&mins(b.start)<mins(a.end))pairs.push([a,b]);
 }));
 return pairs;
}
function render(){
 document.getElementById("terms").innerHTML=data.terms.map((t,ti)=>{
  const pairs=clashes(t.classes),bad=new Set(pairs.flat().map(c=>c.id));
  const warn=pairs.length?`<div class="warn-box"><strong>⚠ تداخل زمانی</strong>${pairs.map(([a,b])=>`<div>${esc(a.name||"بدون نام")} و ${esc(b.name||"بدون نام")} — ${dayName(a.day)} ${norm(a.start)}–${norm(a.end)} / ${norm(b.start)}–${norm(b.end)}</div>`).join("")}</div>`:"";
  return `
 <div class="term-card ${t.id===data.activeTermId?"active":""}">
   <div class="term-head"><input class="input" style="max-width:320px" value="${esc(t.name)}" oninput="data.terms[${ti}].name=this.value"><span class="badge">${t.classes.length} کلاس</span></div>
   <div class="card-actions"><button class="secondary" onclick="setActive(${ti})">${t.id===data.activeTermId?"✓ فعال":"فعال"}</button><button class="primary" onclick="addClass(${ti})">+ کلاس</button></div>
   ${warn}
   <div style="margin-top:12px">${t.classes.map((c,ci)=>classEditor(ti,ci,c,bad.has(c.id))).join("")||'<div class="empty"><span>هنوز کلاسی اضافه نشده.</span></div>'}</div>
 </div>`;
 }).join("");
}
function classEditor(ti,ci,c,isBad){
 const p=`data.terms[${ti}].classes[${ci}]`;
 const colors=COLORS.includes(c.color)?COLORS:[...COLORS,c.color];
 return `<div class="setting-card class-edit ${isBad?"clash":""}">
 <div class="form-grid">
 <div class="field full"><label>نام درس</label><input class="input" value="${esc(c.name)}" oninput="${p}.name=this.value"></div>
 <div class="field"><label>روز</label><select class="select" onchange="${p}.day=this.value;render()">${DAYS.map(d=>`<option value="${d[0]}" ${c.day===d[0]?"selected":""}>${d[1]}</option>`).join("")}</select></div>
 <div class="field"><label>رنگ</label><select class="select" style="border-right:8px solid ${safeColor(c.color)}" onchange="${p}.color=this.value;render()">${colors.map((x,i)=>`<option value="${esc(x)}" ${c.color===x?"selected":""}>${i<COLORS.length?"رنگ "+(i+1):"رنگ فایل ("+esc(x)+")"}</option>`).join("")}</select></div>
 <div class="field"><label>شروع</label><input class="input" type="time" value="${esc(norm(c.start))}" onchange="${p}.start=this.value;render()"></div>
 <div class="field"><label>پایان</label><input class="input" type="time" value="${esc(norm(c.end))}" onchange="${p}.end=this.value;render()"></div>
 <div class="field"><label>دانشکده</label><input class="input" value="${esc(c.faculty)}" oninput="${p}.faculty=this.value"></div>
 <div class="field"><label>شماره کلاس</label><input class="input" value="${esc(c.room)}" oninput="${p}.room=this.value"></div>
 <div class="field"><label>استاد</label><input class="input" value="${esc(c.teacher)}" oninput="${p}.teacher=this.value"></div>
 <div class="field"><label>واحد</label><input class="input" type="number" min="0" value="${Number(c.units)||0}" oninput="${p}.units=Number(this.value)||0"></div>
 </div>
 ${isBad?'<div class="clash-note">⚠ این کلاس با کلاس دیگری تداخل زمانی دارد.</div>':""}
 <button class="danger-btn" onclick="removeClass(${ti},${ci})">حذف کلاس</button>
 </div>`;
}
function downloadUser(){
 const username=document.getElementById("username").value.trim();
 if(!/^[A-Za-z0-9_-]+$/.test(username)){alert("نام کاربری فقط انگلیسی، عدد، _ یا - باشد.");return;}
 const problems=[];
 data.terms.forEach(t=>t.classes.forEach(c=>{
  if(!String(c.name).trim())problems.push(`«${t.name}»: یک کلاس بدون نام وجود دارد.`);
  else if(!norm(c.start)||!norm(c.end)||mins(c.end)<=mins(c.start))problems.push(`«${c.name}»: ساعت شروع و پایان معتبر نیست.`);
 }));
 if(problems.length){alert("قبل از ذخیره این موارد را اصلاح کن:\n\n"+problems.join("\n"));return;}
 data.username=username;data.displayName=document.getElementById("displayName").value.trim()||username;
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=username+".json";a.click();URL.revokeObjectURL(a.href);
 alert("فایل ساخته شد. آن را داخل پوشه users در GitHub قرار بده.");
}
function normalizeData(x){
 const stamp=Date.now();
 x.version=x.version||1;
 x.displayName=x.displayName||x.username;
 if(!x.terms.length)x.terms.push({id:"t1",name:"ترم جدید",classes:[]});
 x.terms=x.terms.map((t,i)=>({
  ...t,
  id:t.id||"t_"+stamp+"_"+i,
  name:t.name||"",
  classes:(Array.isArray(t.classes)?t.classes:[]).map((c,j)=>({...newClass(),id:"c_"+stamp+"_"+i+"_"+j,...c}))
 }));
 if(!x.terms.some(t=>t.id===x.activeTermId))x.activeTermId=x.terms[0].id;
 return x;
}
function loadFile(e){
 const input=e.target,file=input.files?.[0];
 if(!file)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const x=JSON.parse(r.result);
   if(typeof x.username!=="string"||!x.username||!Array.isArray(x.terms))throw 0;
   data=normalizeData(x);syncUserFields();render();
  }catch{alert("فایل برنامه معتبر نیست.")}
 };
 r.readAsText(file);
 input.value="";
}
syncUserFields();
render();
</script>
</body></html>
